name: Build Telegram iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: telegram-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      # Do not let checkout resolve relative submodule URLs against this fork.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Fetch Telegram submodules
        shell: bash
        run: |
          set -euo pipefail
          # Relative URLs such as ../tgcalls.git otherwise resolve to
          # skokd943-sketch/tgcalls, which does not exist.
          git config --global url."https://github.com/TelegramMessenger/".insteadOf "https://github.com/skokd943-sketch/"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Show environment
        shell: bash
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          git submodule status

      - name: Read Bazel version
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          BAZEL="$(jq -r '.bazel | split(":")[0]' versions.json)"
          echo "bazel=$BAZEL" >> "$GITHUB_OUTPUT"
          echo "Bazel version: $BAZEL"

      - name: Install Bazel
        shell: bash
        run: |
          set -euo pipefail
          BAZEL="${{ steps.versions.outputs.bazel }}"

          case "$(uname -m)" in
            arm64) ARCH=arm64 ;;
            x86_64) ARCH=x86_64 ;;
            *) echo "::error::Unsupported CPU architecture: $(uname -m)"; exit 1 ;;
          esac

          URL="https://github.com/bazelbuild/bazel/releases/download/${BAZEL}/bazel-${BAZEL}-darwin-${ARCH}"
          echo "Downloading $URL"
          curl --fail --location --retry 3 "$URL" -o bazel
          chmod +x bazel
          sudo install -m 755 bazel /usr/local/bin/bazel
          bazel --version

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/telegram-bazel-cache
            ~/.cache/bazel
            ~/Library/Caches/bazel
          key: bazel-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.bazel }}-${{ hashFiles('MODULE.bazel.lock', 'WORKSPACE', 'versions.json') }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.bazel }}-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate configuration
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TG_API_ID" || { echo "::error::Missing TG_API_ID Actions secret"; exit 1; }
          test -n "$TG_API_HASH" || { echo "::error::Missing TG_API_HASH Actions secret"; exit 1; }

          TEMPLATE="build-system/template_minimal_development_configuration.json"
          test -f "$TEMPLATE" || { echo "::error::Missing configuration template: $TEMPLATE"; exit 1; }

          jq --arg id "$TG_API_ID" --arg hash "$TG_API_HASH" \
            '.api_id=$id | .api_hash=$hash' "$TEMPLATE" > configuration.json

          python3 -m json.tool configuration.json >/dev/null

      - name: Build IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber="${GITHUB_RUN_NUMBER}" \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath="$GITHUB_WORKSPACE/out"

      - name: Verify IPA
        shell: bash
        run: |
          set -euo pipefail
          find out -maxdepth 1 -type f -name '*.ipa' -print
          if ! find out -maxdepth 1 -type f -name '*.ipa' -print -quit | grep -q .; then
            echo "::error::Build completed but no IPA was found in out/"
            find . -type f \( -name '*.ipa' -o -name '*.xcarchive' \) -not -path './.git/*' | head -100
            exit 1
          fi
          ls -lh out/*.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-iOS-IPA-${{ github.run_number }}
          path: out/*.ipa
          if-no-files-found: error
          retention-days: 7
