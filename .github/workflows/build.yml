name: Build IPA

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch submodules from TelegramMessenger
        run: |
          git config --global url."https://github.com/TelegramMessenger/".insteadOf "https://github.com/${{ github.repository_owner }}/"
          git submodule update --init --recursive

      - name: Show required versions
        run: cat versions.json

      - name: Select Xcode from versions.json
        run: |
          XC=$(jq -r '.xcode' versions.json)
          echo "Need Xcode $XC"
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s "/Applications/Xcode_${XC}.app"
          xcodebuild -version

      - name: Install Bazel from versions.json
        run: |
          BZ=$(jq -r '.bazel' versions.json)
          echo "Need Bazel $BZ"
          curl -L -o bazel "https://github.com/bazelbuild/bazel/releases/download/${BZ}/bazel-${BZ}-darwin-arm64"
          chmod +x bazel
          sudo mv bazel /usr/local/bin/bazel
          bazel --version

      - name: Create build configuration
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          jq --arg id "$TG_API_ID" --arg hash "$TG_API_HASH" \
            '.api_id=$id | .api_hash=$hash | .bundle_id="org.myfork.messenger"' \
            build-system/template_minimal_development_configuration.json > config.json

      - name: Build
        run: |
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=config.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber=100001 \
            --configuration=release_arm64

      - name: Collect IPA
        run: |
          mkdir -p out
          find bazel-bin -name "*.ipa" -exec cp {} out/ \;
          ls -la out

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: out/*.ipa
