name: Build IPA

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch submodules from TelegramMessenger
        run: |
          git config --global url."https://github.com/TelegramMessenger/".insteadOf "https://github.com/${{ github.repository_owner }}/"
          git submodule update --init --recursive

      - name: Show required versions
        run: cat versions.json

      - name: Select newest installed Xcode
        run: |
          echo "Telegram wants Xcode $(jq -r '.xcode' versions.json)"
          ls /Applications | grep -i xcode || true
          XC=$(ls /Applications | grep -E '^Xcode_[0-9.]+\.app$' | sed -E 's/^Xcode_(.*)\.app$/\1/' | sort -V | tail -1)
          echo "Using Xcode $XC"
          sudo xcode-select -s "/Applications/Xcode_${XC}.app"
          xcodebuild -version
          REAL=$(xcodebuild -version | head -1 | awk '{print $2}')
          jq --arg v "$REAL" '.xcode=$v' versions.json > versions.tmp && mv versions.tmp versions.json
          cat versions.json

      - name: Install Bazel from versions.json
        run: |
          BZ=$(jq -r '.bazel' versions.json)
          echo "Need Bazel $BZ"
          curl -L -o bazel "https://github.com/bazelbuild/bazel/releases/download/${BZ}/bazel-${BZ}-darwin-arm64"
          chmod +x bazel
          sudo mv bazel /usr/local/bin/bazel
          bazel --version

      - name: Create build configuration
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          jq --arg id "$TG_API_ID" --arg hash "$TG_API_HASH" \
            '.api_id=$id | .api_hash=$hash' \
            build-system/template_minimal_development_configuration.json > config.json

      - name: Diagnose
        continue-on-error: true
        run: |
          echo "=== template config ==="
          cat build-system/template_minimal_development_configuration.json
          echo "=== fake-codesigning ==="
          ls -R build-system/fake-codesigning | head -60
          echo "=== where aps-environment is checked ==="
          grep -rn "aps-environment" build-system/Make/ || true
          echo "=== build options ==="
          python3 build-system/Make/Make.py build --help 2>&1 | head -80 || true

      - name: Build
        run: |
          BASE="python3 build-system/Make/Make.py --cacheDir=$HOME/telegram-bazel-cache build --configurationPath=config.json --codesigningInformationPath=build-system/fake-codesigning --buildNumber=100001 --configuration=release_arm64"
          echo "=== Attempt 1: default ==="
          $BASE || {
            echo "=== Attempt 2: --disableProvisioningProfiles ==="
            $BASE --disableProvisioningProfiles || {
              echo "=== Attempt 3: --disableProvisioningProfiles --disableExtensions ==="
              $BASE --disableProvisioningProfiles --disableExtensions
            }
          }

      - name: Collect IPA
        run: |
          mkdir -p out
          find bazel-bin -name "*.ipa" -exec cp {} out/ \;
          ls -la out

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: out/*.ipa
